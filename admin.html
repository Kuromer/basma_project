<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASMAH | Admin Dashboard</title>
    <!-- Cairo Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==================== DESIGN TOKENS ==================== */
        :root {
            --snow: #fffbff;
            --bg-color: #d0c3b2;
            --primary-taupe: #92817a;
            --text-darkcoffee: #362417;
            --text-black: #000500;
            --font-main: "Cairo", sans-serif;
            --danger: #ff4757;
            --warning: #e0a800;
            --success: #28a745;
            --card-shadow: 0 10px 25px rgba(54, 36, 23, 0.08);
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ==================== BASE RESET ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f4f0;
            font-family: var(--font-main);
            color: var(--text-darkcoffee);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button, input, select {
            font-family: var(--font-main);
            outline: none;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ==================== NAVBAR ==================== */
        .admin-navbar {
            background-color: var(--text-darkcoffee);
            color: var(--snow);
            padding: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .admin-nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--snow);
        }

        .admin-badge {
            background-color: var(--primary-taupe);
            color: var(--snow);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* ==================== STATS CARDS ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: var(--snow);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background-color: #f0eae1;
            color: var(--text-darkcoffee);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .stat-info h4 {
            font-size: 0.85rem;
            color: var(--primary-taupe);
            text-transform: uppercase;
        }

        .stat-info p {
            font-size: 1.6rem;
            font-weight: 800;
        }

        /* ==================== MAIN CONTENT GRID ==================== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: start;
            margin-bottom: 50px;
        }

        /* Form Card */
        .form-card {
            background: var(--snow);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0eae1;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #e0d8cd;
            border-radius: 12px;
            font-size: 0.95rem;
            background: #fdfbf7;
            transition: var(--transition-smooth);
        }

        .form-control:focus {
            border-color: var(--text-darkcoffee);
            background: var(--snow);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit {
            flex: 1;
            background-color: var(--text-darkcoffee);
            color: var(--snow);
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-submit:hover {
            background-color: var(--text-black);
        }

        .btn-cancel {
            background-color: #e2dad0;
            color: var(--text-darkcoffee);
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: none; /* Shown only in edit mode */
            transition: var(--transition-smooth);
        }

        .btn-cancel:hover {
            background-color: #d0c3b2;
        }

        /* Table Card */
        .table-card {
            background: var(--snow);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow-x: auto;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
        }

        .products-table th,
        .products-table td {
            padding: 14px;
            border-bottom: 1px solid #efe8e0;
            vertical-align: middle;
        }

        .products-table th {
            background-color: #f7f4f0;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--primary-taupe);
        }

        .table-img {
            width: 50px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            background-color: #e2dad0;
            color: var(--text-darkcoffee);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: var(--transition-smooth);
        }

        .btn-edit {
            background-color: #fff3cd;
            color: var(--warning);
        }

        .btn-edit:hover {
            background-color: var(--warning);
            color: white;
        }

        .btn-delete {
            background-color: #ffe5e7;
            color: var(--danger);
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .form-card {
                position: static;
            }
        }
    </style>
</head>
<body>

    <!-- Admin Navbar -->
    <header class="admin-navbar">
        <div class="container admin-nav-container">
            <div style="display: flex; align-items: center; gap: 12px;">
                <a href="home_page.html" class="brand-logo">BASMAH</a>
                <span class="admin-badge">Admin Panel</span>
            </div>
            <a href="home_page.html" style="color: #c5b8ad; font-size: 0.9rem;"><i class="fa-solid fa-house"></i> View Store</a>
        </div>
    </header>

    <div class="container">
        <!-- Quick Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div class="stat-info">
                    <h4>Total Products</h4>
                    <p id="statTotal">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-tags"></i></div>
                <div class="stat-info">
                    <h4>Categories</h4>
                    <p id="statCategories">4</p>
                </div>
            </div>
        </div>

        <!-- Main Dashboard Content -->
        <div class="dashboard-grid">
            
            <!-- Add / Edit Product Form -->
            <div class="form-card">
                <div class="card-title">
                    <span id="formTitleText"><i class="fa-solid fa-plus-circle"></i> Add New Product</span>
                </div>
                <form id="productForm">
                    <!-- Hidden field to store index during editing -->
                    <input type="hidden" id="editIndex" value="-1">

                    <div class="form-group">
                        <label class="form-label">Product Title</label>
                        <input type="text" id="prodTitle" class="form-control" placeholder="e.g. Linen Summer Dress" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="prodCategory" class="form-control" required>
                            <option value="dresses">Dresses</option>
                            <option value="abayas">Abayas</option>
                            <option value="casual">Casual</option>
                            <option value="sale">Sale</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Price ($)</label>
                        <input type="number" step="0.01" id="prodPrice" class="form-control" placeholder="89.00" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Available Sizes</label>
                        <input type="text" id="prodSize" class="form-control" placeholder="S / M / L / XL" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Badge Tag (Optional)</label>
                        <input type="text" id="prodBadge" class="form-control" placeholder="New Arrival, Best Seller...">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Image URL</label>
                        <input type="url" id="prodImage" class="form-control" placeholder="https://images.unsplash.com/..." required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit" id="submitBtn"><i class="fa-solid fa-check"></i> Save Product</button>
                        <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Products List Table -->
            <div class="table-card">
                <h3 class="card-title" style="border:none;"><i class="fa-solid fa-list-check"></i> Manage Inventory</h3>
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Badge</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsTable">
                        <!-- Injected via JavaScript -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        const token = localStorage.getItem('basmah_token');
        const currentUser = JSON.parse(localStorage.getItem('basmah_user'));

        // حماية الصفحة: التحقق من تسجيل دخول الإدمن
        if (!token || !currentUser || currentUser.role !== 'admin') {
            alert('Please sign in with an Admin account first (admin@basmah.com / admin123)');
            window.location.href = 'signup.html';
        }

        const authHeaders = {
            'Content-Type': 'application/json',
            'Authorization': `Token ${token}`
        };

        let adminProducts = [];

        const tableBody = document.getElementById('adminProductsTable');
        const productForm = document.getElementById('productForm');
        const statTotal = document.getElementById('statTotal');
        const statCategories = document.getElementById('statCategories');
        const editIndexInput = document.getElementById('editIndex');
        const formTitleText = document.getElementById('formTitleText');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        async function loadAdminData() {
            try {
                // جلب الإحصائيات
                const statsRes = await fetch(`${API_BASE}/admin/stats/`, { headers: authHeaders });
                if (statsRes.ok) {
                    const stats = await statsRes.json();
                    statTotal.innerText = stats.total_products;
                    statCategories.innerText = stats.categories_count;
                }

                // جلب المنتجات
                const prodRes = await fetch(`${API_BASE}/admin/products/`, { headers: authHeaders });
                if (prodRes.ok) {
                    adminProducts = await prodRes.json();
                    renderTable();
                }
            } catch (err) {
                console.error('Error loading admin data:', err);
            }
        }

        function renderTable() {
            tableBody.innerHTML = '';
            statTotal.innerText = adminProducts.length;

            adminProducts.forEach((product, index) => {
                const imgUrl = product.image || (product.images && product.images[0]) || '';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${imgUrl}" class="table-img" alt="${product.title}"></td>
                    <td><strong>${product.title}</strong><br><small style="color:var(--primary-taupe)">${product.size}</small></td>
                    <td><span class="badge-status">${product.category}</span></td>
                    <td><strong>$${parseFloat(product.price).toFixed(2)}</strong></td>
                    <td>${product.badge ? `<span style="font-size:0.75rem; font-weight:700;">${product.badge}</span>` : '-'}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-action btn-edit" onclick="editProduct(${index})" title="Edit Product">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteProduct(${index})" title="Delete Product">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // إضافة أو تعديل منتج في قاعدة البيانات
        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const index = parseInt(editIndexInput.value);
            const sizeStr = document.getElementById('prodSize').value.trim();
            const imageUrl = document.getElementById('prodImage').value.trim();

            const payload = {
                title: document.getElementById('prodTitle').value.trim(),
                category: document.getElementById('prodCategory').value,
                price: parseFloat(document.getElementById('prodPrice').value),
                size: sizeStr,
                sizes_available: sizeStr.split('/').map(s => s.trim()).filter(Boolean),
                badge: document.getElementById('prodBadge').value.trim(),
                images: [imageUrl]
            };

            try {
                if (index >= 0) {
                    const productId = adminProducts[index].id;
                    const res = await fetch(`${API_BASE}/admin/products/${productId}/`, {
                        method: 'PUT',
                        headers: authHeaders,
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) alert('Product updated successfully!');
                } else {
                    const res = await fetch(`${API_BASE}/admin/products/`, {
                        method: 'POST',
                        headers: authHeaders,
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) alert('Product added successfully!');
                }
                resetForm();
                loadAdminData();
            } catch (err) {
                alert('Error saving product!');
            }
        });

        function editProduct(index) {
            const product = adminProducts[index];
            editIndexInput.value = index;

            document.getElementById('prodTitle').value = product.title;
            document.getElementById('prodCategory').value = product.category;
            document.getElementById('prodPrice').value = parseFloat(product.price);
            document.getElementById('prodSize').value = product.size;
            document.getElementById('prodBadge').value = product.badge || '';
            document.getElementById('prodImage').value = product.image || (product.images && product.images[0]) || '';

            formTitleText.innerHTML = `<i class="fa-regular fa-pen-to-square"></i> Edit Product #${product.id}`;
            submitBtn.innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> Update Product`;
            cancelBtn.style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            editIndexInput.value = "-1";
            productForm.reset();
            formTitleText.innerHTML = `<i class="fa-solid fa-plus-circle"></i> Add New Product`;
            submitBtn.innerHTML = `<i class="fa-solid fa-check"></i> Save Product`;
            cancelBtn.style.display = 'none';
        }

        async function deleteProduct(index) {
            const product = adminProducts[index];
            if (confirm(`Are you sure you want to delete "${product.title}"?`)) {
                await fetch(`${API_BASE}/admin/products/${product.id}/`, {
                    method: 'DELETE',
                    headers: authHeaders
                });
                loadAdminData();
                resetForm();
            }
        }

        loadAdminData();
    </script>
</body>
</html>
