<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Basmah Clothing</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #d0c3b2;
            --snow: #fffbff;
            --primary-taupe: #92817a;
            --text-darkcoffee: #362417;
            --text-black: #000500;
            --font-main: "Cairo", sans-serif;
            --danger: #ff4757;
            --success: #28a745;
            --border-color: #e5dec9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-main);
            color: var(--text-darkcoffee);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--snow);
            padding: 20px 5%;
            box-shadow: 0 4px 15px rgba(54, 36, 23, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-darkcoffee);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .back-link {
            color: var(--primary-taupe);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--text-darkcoffee);
        }

        .checkout-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 30px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        .checkout-card {
            background: var(--snow);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(54, 36, 23, 0.08);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-darkcoffee);
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
            background: #fff;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary-taupe);
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .payment-option {
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .payment-option.active {
            border-color: var(--text-darkcoffee);
            background-color: #f7f4ef;
        }

        .payment-option input {
            width: auto;
            cursor: pointer;
        }

        .order-summary-items {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
        }

        .summary-item img {
            width: 55px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
        }

        .summary-details h4 {
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .summary-details p {
            font-size: 0.8rem;
            color: var(--primary-taupe);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .summary-row.total {
            font-size: 1.2rem;
            font-weight: 800;
            border-top: 2px solid var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
            color: var(--text-darkcoffee);
        }

        .btn-submit-order {
            width: 100%;
            background-color: var(--text-darkcoffee);
            color: var(--snow);
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: var(--font-main);
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-submit-order:hover {
            background-color: var(--text-black);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--snow);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-icon {
            width: 70px;
            height: 70px;
            background: var(--success);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>

    <header>
        <a href="/home_page" class="logo">BASMAH</a>
        <a href="/home_page" class="back-link">← Back to Shop</a>
    </header>

    <div class="checkout-container">
        <!-- Shipping Details Form -->
        <div class="checkout-card">
            <h2 class="section-title">Shipping Information</h2>
            <form id="checkoutForm">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" required placeholder="Enter your full name">
                    </div>
                    <div class="input-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" required placeholder="example@mail.com">
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" required placeholder="01XXXXXXXXX">
                    </div>
                    <div class="input-group">
                        <label for="city">Governorate *</label>
                        <select id="city" required>
                            <option value="Cairo">Cairo</option>
                            <option value="Giza">Giza</option>
                            <option value="Alexandria">Alexandria</option>
                            <option value="Menofia">Menofia</option>
                            <option value="Dakahlia">Dakahlia</option>
                            <option value="Other">Other Governorate</option>
                        </select>
                    </div>
                    <div class="input-group full-width">
                        <label for="address">Detailed Address *</label>
                        <input type="text" id="address" required placeholder="Street name / Building No. / Apartment">
                    </div>
                </div>

                <h2 class="section-title">Payment Method</h2>
                <div class="payment-methods">
                    <label class="payment-option active">
                        <input type="radio" name="payment" value="cod" checked>
                        <div>
                            <strong>Cash on Delivery (COD)</strong>
                            <p style="font-size: 0.8rem; color: var(--primary-taupe);">Pay with cash upon package delivery</p>
                        </div>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment" value="vodafone">
                        <div>
                            <strong>Vodafone Cash / Digital Wallet</strong>
                            <p style="font-size: 0.8rem; color: var(--primary-taupe);">Direct transfer via electronic wallet</p>
                        </div>
                    </label>
                </div>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="checkout-card">
            <h2 class="section-title">Order Summary</h2>
            <div id="checkoutOrderItems" class="order-summary-items"></div>

            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="subtotalPrice">0 EGP</span>
            </div>
            <div class="summary-row">
                <span>Shipping Fee:</span>
                <span id="shippingPrice">60 EGP</span>
            </div>
            <div class="summary-row total">
                <span>Total:</span>
                <span id="totalPrice">0 EGP</span>
            </div>

            <button type="button" id="btnSubmitOrder" class="btn-submit-order">Place Order</button>
        </div>
    </div>

    <!-- Order Success Modal -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">✓</div>
            <h2>Order Placed Successfully!</h2>
            <p style="color: var(--primary-taupe); margin: 15px 0;">Thank you for shopping at Basmah. Your order ID is: <strong id="orderId" style="color:var(--text-darkcoffee);">#BSM-0000</strong></p>
            <button onclick="window.location.href='/home_page'" class="btn-submit-order" style="margin-top: 10px;">Return to Shop</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let currentSubtotal = 0;

        document.addEventListener('DOMContentLoaded', () => {
            // ملء بيانات المستخدم تلقائياً إن وجد
            const savedUser = JSON.parse(localStorage.getItem('basmah_user'));
            if (savedUser) {
                document.getElementById('fullName').value = savedUser.name || '';
                document.getElementById('email').value = savedUser.email || '';
                document.getElementById('phone').value = savedUser.phone || '';
            }

            // تفعيل التبديل البصري بين وسائل الدفع
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    opt.querySelector('input').checked = true;
                });
            });

            const cart = JSON.parse(localStorage.getItem('basmah_cart')) || [];
            const container = document.getElementById('checkoutOrderItems');

            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding: 20px; color: var(--primary-taupe);">Your cart is currently empty.<br><a href="/home_page" style="color:var(--text-darkcoffee); font-weight:bold;">Browse Products</a></p>`;
                updateTotals(0);
                return;
            }

            currentSubtotal = 0;
            container.innerHTML = '';

            cart.forEach(item => {
                const itemPrice = parseFloat(item.price);
                const itemTotal = itemPrice * item.quantity;
                currentSubtotal += itemTotal;

                container.innerHTML += `
                    <div class="summary-item">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="summary-details" style="flex:1;">
                            <h4>${item.title}</h4>
                            <p>Size: ${item.size || 'M'} | Color: ${item.color || 'Standard'} | Qty: ${item.quantity}</p>
                        </div>
                        <span style="font-weight:700;">$${itemTotal.toFixed(2)}</span>
                    </div>
                `;
            });

            updateTotals(currentSubtotal);
        });

        function updateTotals(subtotal) {
            const shipping = subtotal > 0 ? 60 : 0;
            const total = subtotal + shipping;

            document.getElementById('subtotalPrice').innerText = `$${subtotal.toFixed(2)}`;
            document.getElementById('shippingPrice').innerText = `$${shipping.toFixed(2)}`;
            document.getElementById('totalPrice').innerText = `$${total.toFixed(2)}`;
        }

        // إرسال الطلب الفعلي إلى الباك إند
        document.getElementById('btnSubmitOrder').addEventListener('click', async () => {
            const form = document.getElementById('checkoutForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const cart = JSON.parse(localStorage.getItem('basmah_cart')) || [];
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            const shipping = 60;
            const total = currentSubtotal + shipping;
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

            const payload = {
                full_name: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                governorate: document.getElementById('city').value,
                address: document.getElementById('address').value.trim(),
                payment_method: paymentMethod,
                subtotal: currentSubtotal.toFixed(2),
                shipping_fee: shipping.toFixed(2),
                total: total.toFixed(2),
                items: cart.map(item => ({
                    product_id: item.id || null,
                    title: item.title,
                    size: item.size || 'M',
                    color: item.color || 'Standard',
                    quantity: item.quantity,
                    unit_price: parseFloat(item.price).toFixed(2),
                    image: item.image || ''
                }))
            };

            const headers = { 'Content-Type': 'application/json' };
            const token = localStorage.getItem('basmah_token');
            if (token) headers['Authorization'] = `Token ${token}`;

            const submitBtn = document.getElementById('btnSubmitOrder');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Processing Order...';

            try {
                const res = await fetch(`${API_BASE}/orders/`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok) {
                    alert('Failed to place order. Please check your details.');
                    return;
                }

                document.getElementById('orderId').innerText = `#${data.order_id}`;
                localStorage.removeItem('basmah_cart');
                document.getElementById('successModal').style.display = 'flex';
            } catch (err) {
                alert('Server connection error!');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Place Order';
            }
        });
    </script>
</body>
</html>
